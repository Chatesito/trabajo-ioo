{% extends "clinica/base.html" %}

{% block content %}
<h1 class="h3 mb-3">{% if object %}Editar Cita{% else %}Nueva Cita{% endif %}</h1>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'cita_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
